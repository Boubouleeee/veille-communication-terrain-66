name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - main
      - boubouleeee-veille-communication-terrain
    paths-ignore:
      - "README.md"
      - "tests/**"
      - "src/**"
      - ".github/workflows/collect.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assembler le site statique
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets config data notes _site/
      - name: Charger l’artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4
