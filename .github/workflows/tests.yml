name: Vérifications

on:
  push:
    branches:
      - main
      - "boubouleeee-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester le pipeline de collecte
        run: python -m unittest discover -s tests -v
      - name: Vérifier la syntaxe JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check assets/app.js
